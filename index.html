<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Rastreador 3D en tiempo real de satelites en orbita terrestre. Propagacion SGP4/SDP4 sobre CesiumJS."
    />
    <title>CosmoTrack</title>

    <!--
      Iconos. El .ico va primero por los navegadores antiguos, que ignoran el
      resto; los SVG son nitidos a cualquier tamano y el de 16 es una version
      simplificada a proposito, porque el detalle del de 32 se empasta en la
      pestana. El PNG de 192 lo usa Android al anclar la web al escritorio.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon-32.svg" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <meta name="theme-color" content="#0a2540" />
    <!--
      CesiumJS carga Workers, Assets y Widgets como ficheros estaticos en tiempo
      de ejecucion. Se declara aqui, y no en main.js, porque los imports ESM se
      elevan: si se asignara dentro del modulo podria llegar despues de que
      Cesium ya hubiese resuelto su ruta base.
      La ruta la sirve vite-plugin-static-copy (ver vite.config.js).
    -->
    <script>
      window.CESIUM_BASE_URL = '/cesiumStatic/'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
