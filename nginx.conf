server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Celestrak no envia cabeceras CORS permisivas de forma fiable, asi que las
    # peticiones TLE pasan por aqui. Replica el proxy de vite.config.js.
    # proxy_ssl_server_name activa SNI: sin el, el handshake TLS con
    # celestrak.org falla.
    location /celestrak/ {
        proxy_pass https://celestrak.org/;
        proxy_set_header Host celestrak.org;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";

        # Celestrak responde 403 "GP data has not updated..." si repites una
        # descarga antes de 2 h. La app lo trata como senal para usar su cache,
        # asi que el cuerpo tiene que llegarle tal cual.
        proxy_intercept_errors off;

        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # Ficheros con hash en el nombre: inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Workers, Assets y Widgets de CesiumJS. No llevan hash, pero cambian solo
    # al actualizar la dependencia, asi que basta con revalidar cada dia.
    location /cesiumStatic/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML referencia los bundles con hash: si se cachea, el navegador se
    # queda anclado a la version anterior tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
